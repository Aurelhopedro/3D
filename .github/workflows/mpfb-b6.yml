name: MPFB B6 - Anatomia e vestuario
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true
      - name: Download MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip
      - name: Generate B6
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b6
        run: ./blender_bin/blender --background --factory-startup --python-exit-code 1 --python scripts/characters/create_female_b6.py
      - name: Upload B6 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b6-modelo
          path: |
            output/mpfb-b6/mpfb-b6-report.json
            output/mpfb-b6/mpfb-female-b6.blend
            output/mpfb-b6/mpfb-female-b6.glb
            output/mpfb-b6/b6-*.png
          if-no-files-found: warn
