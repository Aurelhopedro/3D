name: MPFB T4 - T3 + madeixas fora da cara (base B7)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao foi descarregado ou esta vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo T4
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-t4
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_t4.py

      - name: Verificar ficheiros e relatorios produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-t4 ==="
          ls -lh output/mpfb-t4/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo ""
          cat output/mpfb-t4/validation_report.md 2>/dev/null || echo "Resumo nao gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-t4-olhos-e-cabelo
          path: |
            output/mpfb-t4/mpfb-t4-report.json
            output/mpfb-t4/diagnostic_report.json
            output/mpfb-t4/validation_report.md
            output/mpfb-t4/mpfb-female-t4.blend
            output/mpfb-t4/mpfb-female-t4.glb
            output/mpfb-t4/t4_view_front.png
            output/mpfb-t4/t4_view_side.png
            output/mpfb-t4/t4_view_threequarter.png
            output/mpfb-t4/t4_view_eyes_closeup.png
            output/mpfb-t4/t4_view_front_no_hair.png
          if-no-files-found: warn
