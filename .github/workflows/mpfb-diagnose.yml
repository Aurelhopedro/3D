name: MPFB Diagnostico de Mesh (medir coordenadas reais)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao descarregado ou vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Correr diagnostico
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-diag
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/diagnose_mpfb_mesh.py

      - name: Mostrar relatorio completo
        if: always()
        run: |
          echo "=== RELATORIO DE DIAGNOSTICO ==="
          cat output/mpfb-diag/mpfb-diag-report.json 2>/dev/null || echo "Relatorio nao gerado"

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-diag-report
          path: output/mpfb-diag/mpfb-diag-report.json
          if-no-files-found: warn
