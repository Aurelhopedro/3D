name: Roupa - Calça Cargo Marfim (Hombaka Song)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Ler configuração do Blender
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('config/blender.json'))
          for k in ('blender_version','blender_series','linux_x64_filename','checksum_filename'):
              print(f'{k}={c[k]}')
          PY

      - name: Restaurar Blender do cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: blender_bin
          key: blender-${{ steps.cfg.outputs.blender_version }}-linux-x64

      - name: Descarregar Blender se não estiver em cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://download.blender.org/release/Blender${{ steps.cfg.outputs.blender_series }}"
          FILE="${{ steps.cfg.outputs.linux_x64_filename }}"
          SHA="${{ steps.cfg.outputs.checksum_filename }}"
          curl -fL --retry 3 -o "$FILE" "$BASE/$FILE"
          curl -fL --retry 3 -o "$SHA" "$BASE/$SHA"
          EXPECTED=$(grep -F "$FILE" "$SHA" | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  $FILE" | sha256sum -c -
          mkdir -p blender_bin
          tar -xJf "$FILE" -C blender_bin --strip-components=1

      - name: Gerar calça cargo (geometria + materiais + detalhes)
        env:
          CARGO_OUTPUT: ${{ github.workspace }}/output/cargo-pants
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/garments/create_cargo_pants.py

      - name: Verificar ficheiros e relatórios produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/cargo-pants ==="
          ls -lh output/cargo-pants/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo ""
          echo "=== Resumo (validation_report.md) ==="
          cat output/cargo-pants/validation_report.md 2>/dev/null || echo "Resumo nao gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-pants-marfim
          path: |
            output/cargo-pants/cargo_pants.blend
            output/cargo-pants/cargo_pants.glb
            output/cargo-pants/validation_report.md
            output/cargo-pants/view_front.png
            output/cargo-pants/view_back.png
            output/cargo-pants/view_side.png
            output/cargo-pants/view_detail_pocket.png
            output/cargo-pants/view_detail_star.png
          if-no-files-found: warn
