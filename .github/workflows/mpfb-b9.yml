name: MPFB B9 - Experimental — Olhos Nativos do MPFB

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/characters/create_female_b9.py
      - .github/workflows/mpfb-b9.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao foi descarregado ou esta vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo B9
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b9
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_b9.py

      - name: Verificar ficheiros produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-b9 ==="
          ls -lh output/mpfb-b9/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo ""
          echo "=== Relatorio JSON ==="
          cat output/mpfb-b9/b9_report.json 2>/dev/null \
            | python3 -c "import sys,json; r=json.load(sys.stdin); \
              print('Status:     ', r.get('status','?')); \
              print('Eye method: ', r.get('eye_method','?')); \
              print('Eye centers:', json.dumps(r.get('eye_centers_used',{}), ensure_ascii=False)); \
              print('Validations:', json.dumps({k: v.get('pass') for k,v in r.get('validations',{}).items()}, ensure_ascii=False)); \
              print('Renders:    ', list(r.get('renders',{}).keys())); \
              print('Limitations:'); [print(' -', l) for l in r.get('visual_limitations',[])]" \
            || cat output/mpfb-b9/b9_report.json 2>/dev/null \
            || echo "Relatorio nao gerado"

      - name: Publicar artefactos B9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b9-experimental-olhos-nativos
          path: |
            output/mpfb-b9/b9_report.json
            output/mpfb-b9/female_b9.blend
            output/mpfb-b9/female_b9.glb
            output/mpfb-b9/b9_01_full_front.png
            output/mpfb-b9/b9_02_face_front.png
            output/mpfb-b9/b9_03_face_side.png
            output/mpfb-b9/b9_04_face_quarter.png
            output/mpfb-b9/b9_05_eyes_closeup.png
          if-no-files-found: warn
