name: MPFB T3 - Olhos dentro das orbitas (base B7)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao foi descarregado ou esta vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo T3 (olhos nas orbitas)
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-t3
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_t3.py

      - name: Verificar ficheiros e relatorios produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-t3 ==="
          ls -lh output/mpfb-t3/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo ""
          echo "=== Resumo legivel (validation_report.md) ==="
          cat output/mpfb-t3/validation_report.md 2>/dev/null || echo "Resumo nao gerado"
          echo ""
          echo "=== Diagnostico dos olhos (diagnostic_report.json) ==="
          cat output/mpfb-t3/diagnostic_report.json 2>/dev/null || echo "Diagnostico nao gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-t3-olhos-nas-orbitas
          path: |
            output/mpfb-t3/mpfb-t3-report.json
            output/mpfb-t3/diagnostic_report.json
            output/mpfb-t3/validation_report.md
            output/mpfb-t3/mpfb-female-t3.blend
            output/mpfb-t3/mpfb-female-t3.glb
            output/mpfb-t3/t3_view_front.png
            output/mpfb-t3/t3_view_side.png
            output/mpfb-t3/t3_view_threequarter.png
            output/mpfb-t3/t3_view_eyes_closeup.png
            output/mpfb-t3/t3_view_front_no_hair.png
          if-no-files-found: warn
