name: MPFB B7 - Modelo Feminino Base (sem roupa, olhos e cabelo corrigidos)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao foi descarregado ou esta vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo B7
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b7
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_b7.py

      - name: Verificar ficheiros produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-b7 ==="
          ls -lh output/mpfb-b7/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo "=== Relatorio JSON ==="
          cat output/mpfb-b7/mpfb-b7-report.json 2>/dev/null || echo "Relatorio nao gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b7-modelo-feminino-base
          path: |
            output/mpfb-b7/mpfb-b7-report.json
            output/mpfb-b7/mpfb-female-b7.blend
            output/mpfb-b7/mpfb-female-b7.glb
          if-no-files-found: warn
