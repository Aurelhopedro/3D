name: MPFB B4 - Primeira Modelo Feminina Completa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar que o ZIP do MPFB existe e não está vazio
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip não foi descarregado ou está vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo B4
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b4
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_b4.py

      - name: Verificar ficheiros produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-b4 ==="
          ls -lh output/mpfb-b4/ 2>/dev/null || echo "Directório vazio ou inexistente"
          echo "=== Relatório JSON ==="
          cat output/mpfb-b4/mpfb-b4-report.json 2>/dev/null || echo "Relatório não gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b4-modelo-feminino
          path: |
            output/mpfb-b4/mpfb-b4-report.json
            output/mpfb-b4/mpfb-female-b4.blend
            output/mpfb-b4/mpfb-female-b4.glb
          if-no-files-found: warn
