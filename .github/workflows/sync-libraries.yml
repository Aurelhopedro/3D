name: Sync Libraries (Sincronizar Bibliotecas)

on:
  workflow_dispatch:
    inputs:
      library_id:
        description: 'ID de uma biblioteca especifica (vazio = todas)'
        required: false
        default: ''
        type: string

  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sync-libraries
  cancel-in-progress: false

jobs:
  sync:
    name: Verificar bibliotecas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verificar JSON de configuracao
        run: |
          python3 -c "import json; json.load(open('config/libraries.json'))" && echo "OK libraries.json"
          python3 -c "import json; json.load(open('config/categories.json'))" && echo "OK categories.json"
          python3 -c "import json; json.load(open('config/blender.json'))" && echo "OK blender.json"

      - name: Listar bibliotecas
        env:
          LIB_ID: ${{ inputs.library_id }}
        run: python3 -I sources/generators/library_manager.py --list

      - name: Relatorio final
        if: always()
        run: |
          echo "Sync Libraries concluido."
          echo "Ver separador Summary para o relatorio completo."
