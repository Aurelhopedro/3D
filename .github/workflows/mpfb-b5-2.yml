name: MPFB Female B5.2 - Base Model (No Clothing)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/characters/create_female_b5_2.py'
      - '.github/workflows/mpfb-b5-2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BLENDER_VERSION: "5.2.1"
      BLENDER_URL: "https://mirrors.dotsrc.org/blender/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz"
      MPFB_OUTPUT: "${{ github.workspace }}/output"
      # URL directa ao mirror oficial do MPFB (release 2.0.18)
      MPFB_DIRECT_URL: "https://files2.makehumancommunity.org/releases/mpfb2-v2.0.18.zip"
      MPFB_FALLBACK_URL: "https://files.makehumancommunity.org/releases/mpfb2-v2.0.18.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: false

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          wget -q "$BLENDER_URL" -O blender.tar.xz
          tar -xJf blender.tar.xz
          mv blender-5.2.1-linux-x64 blender_bin
          rm blender.tar.xz

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgles2 \
            libx11-6 libxrender1 libxi6 libxkbcommon0 xvfb

      - name: Download MPFB
        env:
          MPFB_ZIP_URL: ${{ secrets.MPFB_ZIP_URL }}
        run: |
          mkdir -p /tmp/mpfb_pkg
          if [ -n "$MPFB_ZIP_URL" ]; then
            echo "Usando URL secreta..."
            wget -q "$MPFB_ZIP_URL" -O /tmp/mpfb_pkg/mpfb.zip
          else
            echo "Tentando mirror primario: $MPFB_DIRECT_URL"
            wget -q "$MPFB_DIRECT_URL" -O /tmp/mpfb_pkg/mpfb.zip \
            || {
              echo "Mirror primario falhou. Tentando mirror secundario..."
              wget -q "$MPFB_FALLBACK_URL" -O /tmp/mpfb_pkg/mpfb.zip \
              || {
                echo "Ambos os mirrors falharam. Tentando nightly build..."
                NIGHTLY=$(curl -s https://files2.makehumancommunity.org/plugins/ \
                  | grep -oP 'mpfb2-[0-9]{8}\.zip' | sort | tail -1)
                echo "Nightly: $NIGHTLY"
                wget -q "https://files2.makehumancommunity.org/plugins/$NIGHTLY" \
                  -O /tmp/mpfb_pkg/mpfb.zip
              }
            }
          fi
          ls -lh /tmp/mpfb_pkg/mpfb.zip
          echo "MPFB_ZIP=/tmp/mpfb_pkg/mpfb.zip" >> $GITHUB_ENV

      - name: Criar directorio de output
        run: mkdir -p "$MPFB_OUTPUT"

      - name: Instalar MPFB no Blender
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            blender_bin/blender --background \
            --python-expr "
          import bpy, os, sys
          z = os.environ.get('MPFB_ZIP', '/tmp/mpfb_pkg/mpfb.zip')
          print(f'[MPFB-INSTALL] ZIP: {z}')
          try:
              bpy.ops.extensions.package_install_files(
                  filepath=z, repo='user_default', enable_on_install=True)
              print('[MPFB-INSTALL] OK')
          except Exception as e:
              print(f'[MPFB-INSTALL] ERRO: {e}')
              sys.exit(1)
          "

      - name: Executar script principal
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            blender_bin/blender --background \
            --python scripts/characters/create_female_b5_2.py \
          2>&1 | tee "$MPFB_OUTPUT/blender_run.log"
          EXIT=${PIPESTATUS[0]}
          echo "Exit code: $EXIT"
          exit $EXIT

      - name: Mostrar relatorio
        if: always()
        run: |
          R="$MPFB_OUTPUT/mpfb-b5-2-report.json"
          [ -f "$R" ] && cat "$R" || echo "Relatorio nao encontrado"

      - name: Listar output
        if: always()
        run: ls -lh "$MPFB_OUTPUT/" 2>/dev/null || echo "(vazio)"

      - name: Upload modelo (GLB + BLEND)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpfb-female-b5-2-model
          path: |
            ${{ env.MPFB_OUTPUT }}/mpfb-female-b5-2.glb
            ${{ env.MPFB_OUTPUT }}/mpfb-female-b5-2.blend
          if-no-files-found: warn
          retention-days: 14

      - name: Upload previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpfb-female-b5-2-previews
          path: ${{ env.MPFB_OUTPUT }}/preview_*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload relatorio e log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpfb-female-b5-2-report
          path: |
            ${{ env.MPFB_OUTPUT }}/mpfb-b5-2-report.json
            ${{ env.MPFB_OUTPUT }}/blender_run.log
          if-no-files-found: warn
          retention-days: 14
