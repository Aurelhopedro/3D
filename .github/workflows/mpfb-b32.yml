name: MPFB B3.2 - Female Geometry and Height
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true
      - name: Download MPFB
        run: curl -fL --retry 3 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip
      - name: Generate experimental female
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b32
        run: ./blender_bin/blender --background --factory-startup --python-exit-code 1 --python scripts/characters/create_female_b32.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b32-female
          path: |
            output/mpfb-b32/mpfb-b32-report.json
            output/mpfb-b32/mpfb-female-b32.blend
            output/mpfb-b32/mpfb-female-b32.glb
          if-no-files-found: warn
