name: Character Model Import

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'Existing model in assets/characters/ (OBJ, GLB, GLTF, FBX)'
        required: true
        default: 'assets/characters/human_base/base.obj'
        type: string

permissions:
  contents: read

jobs:
  import-character:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate source model
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          python3 - <<'PY'
          import os
          p = os.environ['SOURCE_FILE']
          if os.path.isabs(p) or '..' in p.split('/') or not p.startswith('assets/characters/'):
              raise SystemExit('Invalid source path')
          if os.path.splitext(p)[1].lower() not in ('.obj', '.glb', '.gltf', '.fbx'):
              raise SystemExit('Unsupported extension')
          if not os.path.isfile(p):
              raise SystemExit('Model not found: ' + p)
          print('Found model:', p, os.path.getsize(p), 'bytes')
          PY
      - name: Read Blender configuration
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open('config/blender.json'))
          for key in ('blender_version', 'blender_series', 'linux_x64_filename', 'checksum_filename'):
              print(f'{key}={c[key]}')
          PY
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: blender_bin
          key: blender-${{ steps.cfg.outputs.blender_version }}-linux-x64
      - name: Download and verify Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://download.blender.org/release/Blender${{ steps.cfg.outputs.blender_series }}"
          FILE="${{ steps.cfg.outputs.linux_x64_filename }}"
          SHA="${{ steps.cfg.outputs.checksum_filename }}"
          curl -fL --retry 3 -o "$FILE" "$BASE/$FILE"
          curl -fL --retry 3 -o "$SHA" "$BASE/$SHA"
          EXPECTED=$(grep -F "$FILE" "$SHA" | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  $FILE" | sha256sum -c -
          mkdir -p blender_bin
          tar -xJf "$FILE" -C blender_bin --strip-components=1
      - name: Import model and render previews
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          set -euo pipefail
          mkdir -p output/character
          ./blender_bin/blender --background --factory-startup --python-exit-code 1 \
            --python scripts/characters/import_female.py -- "$SOURCE_FILE" output/character
          test -s output/character/female-model.blend
          test -s output/character/female-model.glb
          test -s output/character/metadata.json
          for view in front side back perspective; do
            test -s "output/character/${view}.png"
          done
          ls -lh output/character/
      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: female-character-import
          path: output/character/
          if-no-files-found: error
          retention-days: 30
