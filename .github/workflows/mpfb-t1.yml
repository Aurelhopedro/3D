name: MPFB T1 - Correcao experimental dos olhos (base B7)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Blender 5.2.1
        uses: actions/cache/restore@v4
        with:
          path: blender_bin
          key: blender-5.2.1-linux-x64
          fail-on-cache-miss: true

      - name: Descarregar MPFB
        run: curl -fL --retry 3 --retry-delay 5 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip

      - name: Verificar ZIP do MPFB
        run: |
          if [ ! -f mpfb2.zip ] || [ ! -s mpfb2.zip ]; then
            echo "Erro: mpfb2.zip nao foi descarregado ou esta vazio." >&2
            exit 1
          fi
          echo "MPFB ZIP: $(du -sh mpfb2.zip | cut -f1)"

      - name: Gerar modelo T1 (olhos corrigidos)
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-t1
        run: >
          ./blender_bin/blender
          --background
          --factory-startup
          --python-exit-code 1
          --python scripts/characters/create_female_t1.py

      - name: Verificar ficheiros e relatorios produzidos
        if: always()
        run: |
          echo "=== Ficheiros em output/mpfb-t1 ==="
          ls -lh output/mpfb-t1/ 2>/dev/null || echo "Directorio vazio ou inexistente"
          echo ""
          echo "=== Relatorio principal (mpfb-t1-report.json) ==="
          cat output/mpfb-t1/mpfb-t1-report.json 2>/dev/null || echo "Relatorio nao gerado"
          echo ""
          echo "=== Diagnostico dos olhos (diagnostic_report.json) ==="
          cat output/mpfb-t1/diagnostic_report.json 2>/dev/null || echo "Diagnostico nao gerado"
          echo ""
          echo "=== Resumo legivel (validation_report.md) ==="
          cat output/mpfb-t1/validation_report.md 2>/dev/null || echo "Resumo nao gerado"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-t1-correcao-olhos
          path: |
            output/mpfb-t1/mpfb-t1-report.json
            output/mpfb-t1/diagnostic_report.json
            output/mpfb-t1/validation_report.md
            output/mpfb-t1/mpfb-female-t1.blend
            output/mpfb-t1/mpfb-female-t1.glb
            output/mpfb-t1/t1_view_front.png
            output/mpfb-t1/t1_view_side.png
            output/mpfb-t1/t1_view_threequarter.png
            output/mpfb-t1/t1_view_eyes_closeup.png
            output/mpfb-t1/t1_view_front_no_hair.png
          if-no-files-found: warn
