name: MPFB B2 - Generate Base Human
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-human:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read Blender configuration
        id: cfg
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('config/blender.json'))
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('blender_version','blender_series','linux_x64_filename','checksum_filename'):
                  print(f'{k}={c[k]}',file=f)
          PY
      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: blender_bin
          key: blender-${{ steps.cfg.outputs.blender_version }}-linux-x64
      - name: Download Blender if not cached
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://download.blender.org/release/Blender${{ steps.cfg.outputs.blender_series }}"
          FILE="${{ steps.cfg.outputs.linux_x64_filename }}"
          SHA="${{ steps.cfg.outputs.checksum_filename }}"
          curl -fL --retry 3 -o "$FILE" "$BASE/$FILE"
          curl -fL --retry 3 -o "$SHA" "$BASE/$SHA"
          EXPECTED=$(grep -F "$FILE" "$SHA" | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  $FILE" | sha256sum -c -
          mkdir -p blender_bin
          tar -xJf "$FILE" -C blender_bin --strip-components=1
      - name: Download MPFB
        run: curl -fL --retry 3 --connect-timeout 20 -o mpfb2.zip https://files.makehumancommunity.org/plugins/mpfb2-latest.zip
      - name: Create MPFB base human
        env:
          MPFB_ZIP: ${{ github.workspace }}/mpfb2.zip
          MPFB_OUTPUT: ${{ github.workspace }}/output/mpfb-b2
        run: |
          mkdir -p output/mpfb-b2
          ./blender_bin/blender --background --factory-startup --python-exit-code 1 --python scripts/characters/create_female_mpfb.py
      - name: Upload result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-b2-human-test
          path: |
            output/mpfb-b2/mpfb-b2-report.json
            output/mpfb-b2/mpfb-human.blend
            output/mpfb-b2/mpfb-human.glb
          if-no-files-found: warn
